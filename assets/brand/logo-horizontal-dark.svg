<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60" fill="none">
  <defs>
    <linearGradient id="gyPrimary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="gyCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00F0FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Growth Mark Vector (Centered in 50x50 area) -->
  <g transform="translate(6, 5)" filter="url(#glow)">
    <path d="M 6 40 L 6 22 L 15 15 L 15 40 Z" fill="url(#gyPrimary)"/>
    <path d="M 19 40 L 19 15 L 28 7 L 28 40 Z" fill="url(#gyPrimary)"/>
    <path d="M 32 40 L 32 7 L 41 0 L 41 40 Z" fill="url(#gyCyan)"/>
    <polygon points="4,42 43,7 44,11 5,46" fill="#00F0FF" opacity="0.95"/>
    <circle cx="42" cy="5" r="3.2" fill="#00F0FF"/>
  </g>

  <!-- Brand Typography -->
  <text x="68" y="42" font-family="'Poppins', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5px">Growth<tspan fill="#00F0FF">Yug</tspan></text>
</svg>
